[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmamind"
version = "0.1.0"
description = "Personal technical-intelligence system for reproducible, evidence-grounded knowledge"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ElephantRock" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "tree-sitter==0.24.0",
  "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
