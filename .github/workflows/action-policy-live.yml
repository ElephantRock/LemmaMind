name: action-policy-live

on:
  push:
    branches:
      - m0/action-policy-validation

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  action-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Offline regression suite
        run: pytest
      - name: Live Resonance-World action-policy probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/run_action_policy_probe.py --json /tmp/action-policy.json
          echo '=== LEMMAMIND ACTION POLICY PROBE BEGIN ==='
          cat /tmp/action-policy.json
          echo '=== LEMMAMIND ACTION POLICY PROBE END ==='
