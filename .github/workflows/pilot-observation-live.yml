name: pilot-observation-live

on:
  push:
    branches:
      - m0/observation-support

permissions:
  contents: read

jobs:
  observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Offline regression suite
        run: pytest
      - name: Live pinned OpenBot observation probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/run_pilot_observation_probe.py --json /tmp/openbot-observation.json
          echo '=== LEMMAMIND OBSERVATION PROBE BEGIN ==='
          cat /tmp/openbot-observation.json
          echo '=== LEMMAMIND OBSERVATION PROBE END ==='
