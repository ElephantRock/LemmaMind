name: pilot-coverage-live

on:
  push:
    branches:
      - m0/markdown-list-assertions

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Offline regression suite
        run: pytest
      - name: Live pinned external coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/run_pilot_coverage.py \
            --spec eval/pilot/coverage/external-v1.yaml \
            --json /tmp/external-v1.json \
            --markdown /tmp/external-v1.md
          echo '=== LEMMAMIND COVERAGE JSON BEGIN ==='
          cat /tmp/external-v1.json
          echo '=== LEMMAMIND COVERAGE JSON END ==='
          echo '=== LEMMAMIND COVERAGE MARKDOWN BEGIN ==='
          cat /tmp/external-v1.md
          echo '=== LEMMAMIND COVERAGE MARKDOWN END ==='
