name: Temporary M5 exact profile follow-up

on:
  push:
    branches:
      - m5/provenance-bound-change-interpretation

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5/provenance-bound-change-interpretation
          fetch-depth: 1
      - name: Apply exact profile follow-up
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_m5_exact_profile_followup.py
          python -m py_compile \
            src/lemmamind/interval_segmentation_contracts.py \
            src/lemmamind/interval_segmentation.py \
            src/lemmamind/candidate_evidence_packets.py \
            src/lemmamind/__init__.py \
            tests/m5_packet_fixture.py \
            tests/test_interval_segmentation.py \
            tests/test_candidate_evidence_packet_generation_auth.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full test suite
        run: pytest -q
      - name: Commit validated follow-up
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-m5-exact-profile-followup.yml tools/apply_m5_exact_profile_followup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Persist exact interval segmentation profiles'
          git push origin HEAD:m5/provenance-bound-change-interpretation
