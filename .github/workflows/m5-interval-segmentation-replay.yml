name: m5-interval-segmentation-replay

on:
  push:
    branches:
      - m5/interval-candidate-segmentation

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - name: Replay frozen V2-P0 intervals through deterministic segmentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import statistics
          import tempfile
          from collections import Counter
          from pathlib import Path

          from lemmamind.contracts import SourceRole
          from lemmamind.github import GitHubCaptureService
          from lemmamind.interval_segmentation import (
              GitHubIntervalRESTReader,
              IntervalCandidateSegmentationService,
          )
          from lemmamind.objects import ContentAddressedFileStore
          from lemmamind.recursive_tree import (
              RecursiveGitTreeDiffService,
              TrackingAwareGitHubRecursiveTreeCaptureService,
          )
          from lemmamind.storage import SQLiteContractStore
          from lemmamind.tracking import RepositoryTrackingService
          from lemmamind.tracking_contracts import TrackingLevel

          intervals = [
              {
                  "repository": "CopilotKit/OpenBot",
                  "baseline": "43ea5c11210c485551c25b41a4270c56a58591f1",
                  "current": "e8aa34451f73ef2719c22cc557be369d9ea70afb",
                  "target": "app/src/lib/attention/queries.ts",
              },
              {
                  "repository": "openclaw/openclaw",
                  "baseline": "20eef858aafbf6a3c45b0f20366a08192996f91b",
                  "current": "aec260b7002cf56232add300f3dd3454c81a10cf",
                  "target": "src/agents/sticky-model-selection.ts",
              },
              {
                  "repository": "NousResearch/hermes-agent",
                  "baseline": "b2bd1ac63ff137a6287ce989d65dccee6b9155e2",
                  "current": "a6d6060d6128260d8536d0b92ae0324fff028ffd",
                  "target": "hermes_cli/update_contract.py",
              },
          ]

          def percentile95(values):
              if not values:
                  return 0
              ordered = sorted(values)
              return ordered[max(0, math.ceil(0.95 * len(ordered)) - 1)]

          reports = []
          for spec in intervals:
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  store = SQLiteContractStore(root / "lemmamind.db")
                  objects = ContentAddressedFileStore(root / "objects")
                  reader = GitHubIntervalRESTReader(token=os.environ["GITHUB_TOKEN"])
                  capture = GitHubCaptureService(reader, store, objects)
                  previous = capture.capture_repository(
                      spec["repository"],
                      ["README.md"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["baseline"],
                  )
                  current = capture.capture_repository(
                      spec["repository"],
                      ["README.md"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["current"],
                  )
                  tracking = RepositoryTrackingService(store)
                  tracking.assign_level(
                      current.source.source_id,
                      TrackingLevel.DEEP,
                      assigned_by="m5-interval-segmentation-replay",
                      reason="ephemeral V2-P0 interval segmentation replay",
                  )
                  recursive = TrackingAwareGitHubRecursiveTreeCaptureService(
                      reader,
                      store,
                      objects,
                      tracking=tracking,
                  )
                  previous_tree = recursive.capture_recursive_tree(
                      previous.revision.source_revision_id
                  )
                  current_tree = recursive.capture_recursive_tree(
                      current.revision.source_revision_id
                  )
                  diff = RecursiveGitTreeDiffService(store, objects).compare_captures(
                      previous_tree.manifest.capture_id,
                      current_tree.manifest.capture_id,
                  )
                  segmented = IntervalCandidateSegmentationService(
                      reader,
                      store,
                      tracking,
                  ).segment_diff(diff.run.run_id)

                  expected_paths = {item.path for item in diff.deltas}
                  candidate_paths = {
                      path
                      for candidate in segmented.candidates
                      for path in candidate.paths
                  }
                  assert candidate_paths == expected_paths, (
                      f"candidate coverage mismatch for {spec['repository']}"
                  )
                  target_candidates = [
                      candidate
                      for candidate in segmented.candidates
                      if spec["target"] in candidate.paths
                  ]
                  assert len(target_candidates) == 1, (
                      f"known V2-P0 miss not represented exactly once: "
                      f"{spec['repository']} {spec['target']}"
                  )
                  target_candidate = target_candidates[0]
                  sizes = [len(candidate.paths) for candidate in segmented.candidates]
                  commits_with_candidates = len(
                      {candidate.commit_sha for candidate in segmented.candidates}
                  )
                  path_groups = Counter(
                      candidate.path_group for candidate in segmented.candidates
                  )
                  reports.append(
                      {
                          "repository": spec["repository"],
                          "changed_leaf_paths": len(diff.deltas),
                          "total_commits": segmented.commit_range.total_commits,
                          "commit_snapshots": len(segmented.commit_snapshots),
                          "commits_with_candidates": commits_with_candidates,
                          "candidate_count": len(segmented.candidates),
                          "candidate_path_count": sum(sizes),
                          "candidate_min_size": min(sizes) if sizes else 0,
                          "candidate_median_size": statistics.median(sizes) if sizes else 0,
                          "candidate_p95_size": percentile95(sizes),
                          "candidate_max_size": max(sizes) if sizes else 0,
                          "largest_path_groups_by_candidate_count": path_groups.most_common(10),
                          "target": spec["target"],
                          "target_commit_sha": target_candidate.commit_sha,
                          "target_commit_ordinal": target_candidate.commit_ordinal,
                          "target_path_group": target_candidate.path_group,
                          "target_candidate_size": len(target_candidate.paths),
                          "target_represented": True,
                      }
                  )

          print("M5_INTERVAL_SEGMENTATION_REPLAY=" + json.dumps(reports, sort_keys=True))
          print(json.dumps(reports, indent=2, sort_keys=True))
          PY
