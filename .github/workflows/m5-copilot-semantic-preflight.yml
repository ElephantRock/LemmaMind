name: m5-copilot-semantic-preflight

on:
  push:
    branches:
      - m5/provenance-bound-change-interpretation

permissions:
  contents: read
  copilot-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Verify bounded non-interactive semantic inference
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
          GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: "false"
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: "false"
        run: |
          mkdir -p "$RUNNER_TEMP/lemmamind-copilot-preflight"
          cd "$RUNNER_TEMP/lemmamind-copilot-preflight"
          output="$(copilot -p 'Return only this JSON object and no other text: {"status":"ok"}' -s --model gpt-5.2 --no-ask-user --deny-tool='read,write,shell,url,memory')"
          printf '%s\n' "$output"
          COPILOT_OUTPUT="$output" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["COPILOT_OUTPUT"])
          assert value == {"status": "ok"}, value
          print("M5_COPILOT_PREFLIGHT=ok")
          PY
