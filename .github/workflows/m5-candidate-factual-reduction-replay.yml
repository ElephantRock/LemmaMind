name: m5-candidate-factual-reduction-replay

on:
  push:
    branches:
      - m5/candidate-scoped-factual-reduction

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - name: Replay frozen V2-P0 intervals through candidate factual reduction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from collections import Counter
          from pathlib import Path

          from lemmamind.affected_file_planning import AffectedFileCapturePlanner
          from lemmamind.candidate_reduction import CandidateFactualReductionService
          from lemmamind.candidate_reduction_contracts import CandidateReductionDisposition
          from lemmamind.contracts import SourceRole
          from lemmamind.extraction import DeterministicExtractionService
          from lemmamind.github import GitHubCaptureService
          from lemmamind.interval_segmentation import (
              GitHubIntervalRESTReader,
              IntervalCandidateSegmentationService,
          )
          from lemmamind.objects import ContentAddressedFileStore
          from lemmamind.recursive_tree import (
              RecursiveGitTreeDiffService,
              TrackingAwareGitHubRecursiveTreeCaptureService,
          )
          from lemmamind.storage import SQLiteContractStore
          from lemmamind.tracking import RepositoryTrackingService
          from lemmamind.tracking_adapters import TrackingAwareGitHubCaptureService
          from lemmamind.tracking_contracts import TrackingLevel
          from lemmamind.typescript_ast import typescript_aware_extractors

          intervals = [
              {
                  "repository": "CopilotKit/OpenBot",
                  "baseline": "43ea5c11210c485551c25b41a4270c56a58591f1",
                  "current": "e8aa34451f73ef2719c22cc557be369d9ea70afb",
                  "target": "app/src/lib/attention/queries.ts",
              },
              {
                  "repository": "openclaw/openclaw",
                  "baseline": "20eef858aafbf6a3c45b0f20366a08192996f91b",
                  "current": "aec260b7002cf56232add300f3dd3454c81a10cf",
                  "target": "src/agents/sticky-model-selection.ts",
              },
              {
                  "repository": "NousResearch/hermes-agent",
                  "baseline": "b2bd1ac63ff137a6287ce989d65dccee6b9155e2",
                  "current": "a6d6060d6128260d8536d0b92ae0324fff028ffd",
                  "target": "hermes_cli/update_contract.py",
              },
          ]

          reports = []
          for spec in intervals:
              print(f"REPLAY_START {spec['repository']}", flush=True)
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  store = SQLiteContractStore(root / "lemmamind.db")
                  objects = ContentAddressedFileStore(root / "objects")
                  reader = GitHubIntervalRESTReader(token=os.environ["GITHUB_TOKEN"])

                  seed_capture = GitHubCaptureService(reader, store, objects)
                  previous_seed = seed_capture.capture_repository(
                      spec["repository"],
                      ["README.md"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["baseline"],
                  )
                  current_seed = seed_capture.capture_repository(
                      spec["repository"],
                      ["README.md"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["current"],
                  )

                  tracking = RepositoryTrackingService(store)
                  tracking.assign_level(
                      current_seed.source.source_id,
                      TrackingLevel.DEEP,
                      assigned_by="m5-candidate-factual-reduction-replay",
                      reason="ephemeral frozen V2-P0 candidate factual reduction replay",
                  )

                  recursive = TrackingAwareGitHubRecursiveTreeCaptureService(
                      reader,
                      store,
                      objects,
                      tracking=tracking,
                  )
                  previous_tree = recursive.capture_recursive_tree(
                      previous_seed.revision.source_revision_id
                  )
                  current_tree = recursive.capture_recursive_tree(
                      current_seed.revision.source_revision_id
                  )
                  diff = RecursiveGitTreeDiffService(store, objects).compare_captures(
                      previous_tree.manifest.capture_id,
                      current_tree.manifest.capture_id,
                  )

                  planning = AffectedFileCapturePlanner(store, tracking).plan_diff(
                      diff.run.run_id
                  )
                  segmented = IntervalCandidateSegmentationService(
                      reader,
                      store,
                      tracking,
                  ).segment_diff(diff.run.run_id)

                  assert planning.previous_capture_paths
                  assert planning.current_capture_paths
                  explicit_capture = TrackingAwareGitHubCaptureService(
                      reader,
                      store,
                      objects,
                      tracking=tracking,
                  )
                  previous_files = explicit_capture.capture_repository(
                      spec["repository"],
                      list(planning.previous_capture_paths),
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["baseline"],
                  )
                  current_files = explicit_capture.capture_repository(
                      spec["repository"],
                      list(planning.current_capture_paths),
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["current"],
                  )

                  extractors = typescript_aware_extractors()
                  extraction = DeterministicExtractionService(
                      store,
                      objects,
                      artifact_extractors=extractors,
                  )
                  previous_extraction = extraction.extract_capture(
                      previous_files.manifest.capture_id
                  )
                  current_extraction = extraction.extract_capture(
                      current_files.manifest.capture_id
                  )

                  reduced = CandidateFactualReductionService(
                      store,
                      objects,
                  ).reduce_segmentation(
                      diff_run_id=diff.run.run_id,
                      segmentation_run_id=segmented.run.run_id,
                      planner_run_id=planning.run.run_id,
                      previous_capture_id=previous_files.manifest.capture_id,
                      current_capture_id=current_files.manifest.capture_id,
                      previous_extraction_run_id=previous_extraction.run.run_id,
                      current_extraction_run_id=current_extraction.run.run_id,
                      artifact_extractors=extractors,
                  )

                  assert len(reduced.reductions) == len(segmented.candidates)
                  target_reductions = [
                      item for item in reduced.reductions if spec["target"] in item.paths
                  ]
                  assert len(target_reductions) == 1
                  target = target_reductions[0]
                  assert target.disposition is CandidateReductionDisposition.RETAIN

                  signal_counts = Counter()
                  for item in reduced.reductions:
                      for signal in item.signal_kinds:
                          signal_counts[signal.value] += 1

                  report = {
                      "repository": spec["repository"],
                      "changed_leaf_paths": len(diff.deltas),
                      "planned_previous_paths": len(planning.previous_capture_paths),
                      "planned_current_paths": len(planning.current_capture_paths),
                      "planner_suppressed_paths": len(planning.suppressed_paths),
                      "interval_candidates": len(segmented.candidates),
                      "retained_candidates": reduced.retained_count,
                      "suppressed_candidates": reduced.suppressed_count,
                      "signal_counts": dict(sorted(signal_counts.items())),
                      "artifact_deltas": len(reduced.change.artifact_deltas),
                      "structural_deltas": len(reduced.change.structural_deltas),
                      "target": spec["target"],
                      "target_disposition": target.disposition.value,
                      "target_signal_kinds": [item.value for item in target.signal_kinds],
                      "target_candidate_size": len(target.paths),
                      "target_artifact_delta_paths": len(target.artifact_delta_paths),
                      "target_structural_delta_paths": len(target.structural_delta_paths),
                      "target_assertion_changed_paths": len(target.assertion_changed_paths),
                      "target_artifact_only_paths": len(target.artifact_only_paths),
                      "target_git_only_paths": len(target.git_only_paths),
                  }
                  reports.append(report)
                  print(
                      "REPLAY_REPOSITORY=" + json.dumps(report, sort_keys=True),
                      flush=True,
                  )

          print(
              "M5_CANDIDATE_FACTUAL_REDUCTION_REPLAY="
              + json.dumps(reports, sort_keys=True),
              flush=True,
          )
          print(json.dumps(reports, indent=2, sort_keys=True), flush=True)
          PY
