name: Temporary M5 provenance hardening

on:
  push:
    branches:
      - m5/provenance-bound-change-interpretation

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5/provenance-bound-change-interpretation
          fetch-depth: 1
      - name: Apply staged hardening payload
        shell: bash
        run: |
          set -euo pipefail
          cp src/lemmamind/candidate_evidence_packets.py src/lemmamind/candidate_evidence_packets_v1.py
          base64 -d .github/temp/m5-hardening.b64 > /tmp/m5-hardening.tar.gz
          printf '%s  %s\n' '620c47fa2dd0e56f30e1b95e8000e5833d8c7977ce0b1ee3d4085c5053a1710e' '/tmp/m5-hardening.tar.gz' | sha256sum -c -
          tar -xzf /tmp/m5-hardening.tar.gz
          sed -i "/add_profile_to_services('tests\/test_mechanism_review.py')/d" tools/apply_m5_hardening.py
          python tools/apply_m5_hardening.py
          python -m py_compile src/lemmamind/candidate_evidence_packets.py src/lemmamind/candidate_evidence_packet_auth.py tests/m5_packet_fixture.py tests/test_candidate_evidence_packets.py tests/test_candidate_evidence_packet_generation_auth.py tests/test_change_interpretation.py tests/test_mechanism_review.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full test suite
        run: pytest -q
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-m5-hardening.yml .github/temp/m5-hardening.b64 tools/apply_m5_hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Harden packet upstream provenance authentication'
          git push origin HEAD:m5/provenance-bound-change-interpretation
