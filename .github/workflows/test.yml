name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Discover frozen replay wheel digests
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/m5-frozen-wheel-digests"
          mkdir -p "${wheel_dir}"
          python -m pip download \
            --only-binary=:all: \
            --no-deps \
            --dest "${wheel_dir}" \
            'pydantic==2.13.5' \
            'pydantic-core==2.46.5' \
            'annotated-types==0.8.0' \
            'typing-extensions==4.16.0' \
            'typing-inspection==0.4.4' \
            'PyYAML==6.0.3' \
            'tree-sitter==0.24.0' \
            'tree-sitter-typescript==0.23.2'
          sha256sum "${wheel_dir}"/*
          python -m pip --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
