name: M5 BYOK semantic provider preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      ${{
        github.event.issue.number == 35 &&
        github.event.comment.body == '/m5-byok-preflight' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COPILOT_PROVIDER_TYPE: ${{ vars.M5_BYOK_PROVIDER_TYPE }}
      COPILOT_PROVIDER_BASE_URL: ${{ vars.M5_BYOK_BASE_URL }}
      COPILOT_MODEL: ${{ vars.M5_BYOK_MODEL }}
      COPILOT_OFFLINE: "true"
      GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: "false"
      GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: "false"
      M5_COPILOT_VERSION: "1.0.81"
      M5_COPILOT_LINUX_X64_SHA256: "3082c4a27aa683def52e48397c02606dc7f8267dcef1c93949f3f58de4a5cde3"

    steps:
      - name: Require fixed BYOK configuration
        shell: bash
        run: |
          if [[ -z "${COPILOT_PROVIDER_TYPE}" ]]; then
            echo "::error::Repository Actions variable M5_BYOK_PROVIDER_TYPE is not configured."
            exit 1
          fi
          if [[ -z "${COPILOT_PROVIDER_BASE_URL}" ]]; then
            echo "::error::Repository Actions variable M5_BYOK_BASE_URL is not configured."
            exit 1
          fi
          if [[ -z "${COPILOT_MODEL}" ]]; then
            echo "::error::Repository Actions variable M5_BYOK_MODEL is not configured."
            exit 1
          fi
          case "${COPILOT_PROVIDER_TYPE}" in
            openai|anthropic|azure) ;;
            *)
              echo "::error::M5_BYOK_PROVIDER_TYPE must be openai, anthropic, or azure."
              exit 1
              ;;
          esac
          case "${COPILOT_PROVIDER_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::M5_BYOK_BASE_URL must use HTTPS for the hosted replay provider."
              exit 1
              ;;
          esac

      - name: Install checksum-pinned GitHub Copilot CLI
        shell: bash
        run: |
          set -euo pipefail

          download_dir="${RUNNER_TEMP}/lemmamind-copilot-download"
          bin_dir="${RUNNER_TEMP}/lemmamind-byok-bin"
          archive="${download_dir}/copilot-linux-x64.tar.gz"
          url="https://github.com/github/copilot-cli/releases/download/v${M5_COPILOT_VERSION}/copilot-linux-x64.tar.gz"

          mkdir -p "${download_dir}" "${bin_dir}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "${url}" \
            --output "${archive}"

          printf '%s  %s\n' "${M5_COPILOT_LINUX_X64_SHA256}" "${archive}" | sha256sum --check --strict

          tar -xzf "${archive}" -C "${bin_dir}"
          if [[ ! -f "${bin_dir}/copilot" || -L "${bin_dir}/copilot" ]]; then
            echo "::error::Verified Copilot archive did not contain the expected regular copilot executable."
            exit 1
          fi
          chmod 0755 "${bin_dir}/copilot"

          version_output="$("${bin_dir}/copilot" --version)"
          printf '%s\n' "${version_output}"
          if [[ "${version_output}" != *"${M5_COPILOT_VERSION}"* ]]; then
            echo "::error::Checksum-pinned Copilot binary did not report expected version ${M5_COPILOT_VERSION}."
            exit 1
          fi

          echo "M5_COPILOT_BINARY=${bin_dir}/copilot" >> "${GITHUB_ENV}"
          echo "M5_COPILOT_ARCHIVE_SHA256=${M5_COPILOT_LINUX_X64_SHA256}" >> "${GITHUB_ENV}"

      - name: Verify bounded BYOK inference
        shell: bash
        env:
          COPILOT_PROVIDER_API_KEY: ${{ secrets.M5_BYOK_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${COPILOT_PROVIDER_API_KEY}" ]]; then
            echo "::error::Repository Actions secret M5_BYOK_API_KEY is not configured."
            exit 1
          fi
          if [[ -z "${M5_COPILOT_BINARY:-}" || ! -x "${M5_COPILOT_BINARY}" ]]; then
            echo "::error::Checksum-pinned Copilot binary is unavailable."
            exit 1
          fi

          unset GITHUB_TOKEN GH_TOKEN COPILOT_GITHUB_TOKEN
          mkdir -p "${RUNNER_TEMP}/lemmamind-byok-preflight"
          cd "${RUNNER_TEMP}/lemmamind-byok-preflight"

          output="$(
            "${M5_COPILOT_BINARY}" \
              -p 'Return only this JSON object and no other text: {"status":"ok"}' \
              -s \
              --no-ask-user \
              --deny-tool='read,write,shell,url,memory'
          )"
          printf '%s\n' "$output"

          COPILOT_OUTPUT="$output" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["COPILOT_OUTPUT"])
          assert value == {"status": "ok"}, value
          print("M5_BYOK_PREFLIGHT=ok")
          PY
