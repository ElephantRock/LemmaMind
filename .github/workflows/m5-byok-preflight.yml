name: M5 BYOK semantic provider preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COPILOT_PROVIDER_TYPE: ${{ vars.M5_BYOK_PROVIDER_TYPE }}
      COPILOT_PROVIDER_BASE_URL: ${{ vars.M5_BYOK_BASE_URL }}
      COPILOT_MODEL: ${{ vars.M5_BYOK_MODEL }}
      COPILOT_OFFLINE: "true"
      GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: "false"
      GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: "false"

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require fixed BYOK configuration
        shell: bash
        run: |
          if [[ -z "${COPILOT_PROVIDER_TYPE}" ]]; then
            echo "::error::Repository Actions variable M5_BYOK_PROVIDER_TYPE is not configured."
            exit 1
          fi
          if [[ -z "${COPILOT_PROVIDER_BASE_URL}" ]]; then
            echo "::error::Repository Actions variable M5_BYOK_BASE_URL is not configured."
            exit 1
          fi
          if [[ -z "${COPILOT_MODEL}" ]]; then
            echo "::error::Repository Actions variable M5_BYOK_MODEL is not configured."
            exit 1
          fi
          case "${COPILOT_PROVIDER_TYPE}" in
            openai|anthropic|azure) ;;
            *)
              echo "::error::M5_BYOK_PROVIDER_TYPE must be openai, anthropic, or azure."
              exit 1
              ;;
          esac
          case "${COPILOT_PROVIDER_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::M5_BYOK_BASE_URL must use HTTPS for the hosted replay provider."
              exit 1
              ;;
          esac

      - name: Install GitHub Copilot CLI
        shell: bash
        run: npm install -g @github/copilot

      - name: Verify bounded BYOK inference
        shell: bash
        env:
          COPILOT_PROVIDER_API_KEY: ${{ secrets.M5_BYOK_API_KEY }}
        run: |
          if [[ -z "${COPILOT_PROVIDER_API_KEY}" ]]; then
            echo "::error::Repository Actions secret M5_BYOK_API_KEY is not configured."
            exit 1
          fi

          unset GITHUB_TOKEN GH_TOKEN COPILOT_GITHUB_TOKEN
          mkdir -p "${RUNNER_TEMP}/lemmamind-byok-preflight"
          cd "${RUNNER_TEMP}/lemmamind-byok-preflight"

          output="$(
            copilot \
              -p 'Return only this JSON object and no other text: {"status":"ok"}' \
              -s \
              --no-ask-user \
              --deny-tool='read,write,shell,url,memory'
          )"
          printf '%s\n' "$output"

          COPILOT_OUTPUT="$output" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["COPILOT_OUTPUT"])
          assert value == {"status": "ok"}, value
          print("M5_BYOK_PREFLIGHT=ok")
          PY
