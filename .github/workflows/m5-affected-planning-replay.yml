name: m5-affected-planning-replay

on:
  push:
    branches:
      - m5/affected-file-planning

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - name: Replay frozen V2-P0 intervals through affected-file planning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from collections import Counter
          from pathlib import Path

          from lemmamind.affected_file_planning import AffectedFileCapturePlanner
          from lemmamind.capture_planning_contracts import CapturePlanDisposition
          from lemmamind.contracts import SourceRole
          from lemmamind.github import GitHubCaptureService
          from lemmamind.objects import ContentAddressedFileStore
          from lemmamind.recursive_tree import (
              GitHubRecursiveTreeRESTReader,
              RecursiveGitTreeDiffService,
              TrackingAwareGitHubRecursiveTreeCaptureService,
          )
          from lemmamind.storage import SQLiteContractStore
          from lemmamind.tracking import RepositoryTrackingService
          from lemmamind.tracking_contracts import TrackingLevel

          intervals = [
              {
                  "repository": "CopilotKit/OpenBot",
                  "baseline": "43ea5c11210c485551c25b41a4270c56a58591f1",
                  "current": "e8aa34451f73ef2719c22cc557be369d9ea70afb",
                  "target": "app/src/lib/attention/queries.ts",
              },
              {
                  "repository": "openclaw/openclaw",
                  "baseline": "20eef858aafbf6a3c45b0f20366a08192996f91b",
                  "current": "aec260b7002cf56232add300f3dd3454c81a10cf",
                  "target": "src/agents/sticky-model-selection.ts",
              },
              {
                  "repository": "NousResearch/hermes-agent",
                  "baseline": "b2bd1ac63ff137a6287ce989d65dccee6b9155e2",
                  "current": "a6d6060d6128260d8536d0b92ae0324fff028ffd",
                  "target": "hermes_cli/update_contract.py",
              },
          ]

          reports = []
          for spec in intervals:
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  store = SQLiteContractStore(root / "lemmamind.db")
                  objects = ContentAddressedFileStore(root / "objects")
                  reader = GitHubRecursiveTreeRESTReader(token=os.environ["GITHUB_TOKEN"])
                  capture = GitHubCaptureService(reader, store, objects)
                  previous = capture.capture_repository(
                      spec["repository"],
                      ["README.md"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["baseline"],
                  )
                  current = capture.capture_repository(
                      spec["repository"],
                      ["README.md"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["current"],
                  )
                  tracking = RepositoryTrackingService(store)
                  tracking.assign_level(
                      current.source.source_id,
                      TrackingLevel.DEEP,
                      assigned_by="m5-affected-planning-replay",
                      reason="ephemeral V2-P0 affected-file planning replay",
                  )
                  recursive = TrackingAwareGitHubRecursiveTreeCaptureService(
                      reader,
                      store,
                      objects,
                      tracking=tracking,
                  )
                  previous_tree = recursive.capture_recursive_tree(
                      previous.revision.source_revision_id
                  )
                  current_tree = recursive.capture_recursive_tree(
                      current.revision.source_revision_id
                  )
                  diff = RecursiveGitTreeDiffService(store, objects).compare_captures(
                      previous_tree.manifest.capture_id,
                      current_tree.manifest.capture_id,
                  )
                  planned = AffectedFileCapturePlanner(store, tracking).plan_diff(diff.run.run_id)
                  by_path = {plan.path: plan for plan in planned.plans}
                  target_plan = by_path.get(spec["target"])
                  assert target_plan is not None, (
                      f"known V2-P0 miss location not present in plan: "
                      f"{spec['repository']} {spec['target']}"
                  )
                  assert (
                      target_plan.previous.disposition is CapturePlanDisposition.CAPTURE
                      or target_plan.current.disposition is CapturePlanDisposition.CAPTURE
                  ), f"known V2-P0 miss location was suppressed: {spec['target']}"

                  suppressed = [
                      plan
                      for plan in planned.plans
                      if (
                          plan.previous.disposition is CapturePlanDisposition.SUPPRESSED
                          or plan.current.disposition is CapturePlanDisposition.SUPPRESSED
                      )
                  ]
                  reports.append(
                      {
                          "repository": spec["repository"],
                          "changed_leaf_paths": len(diff.deltas),
                          "planned_paths": len(planned.plans),
                          "previous_capture_paths": len(planned.previous_capture_paths),
                          "current_capture_paths": len(planned.current_capture_paths),
                          "suppressed_paths": len(suppressed),
                          "suppression_reasons": dict(
                              sorted(
                                  Counter(
                                      side.reason.value
                                      for plan in suppressed
                                      for side in (plan.previous, plan.current)
                                      if side.disposition is CapturePlanDisposition.SUPPRESSED
                                  ).items()
                              )
                          ),
                          "target": spec["target"],
                          "target_capture_eligible": True,
                      }
                  )

          print("M5_AFFECTED_PLANNING_REPLAY=" + json.dumps(reports, sort_keys=True))
          print(json.dumps(reports, indent=2, sort_keys=True))
          PY
