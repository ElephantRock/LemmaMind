name: github-process-live

on:
  push:
    branches:
      - m0/github-issue-pr-evidence

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  process-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Offline regression suite
        run: pytest
      - name: Live CSD issue/PR capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/run_github_process_probe.py --json /tmp/github-process.json
          echo '=== LEMMAMIND GITHUB PROCESS PROBE BEGIN ==='
          cat /tmp/github-process.json
          echo '=== LEMMAMIND GITHUB PROCESS PROBE END ==='
