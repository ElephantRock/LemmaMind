name: v2-p0-first-interval-probe

on:
  push:
    branches:
      - v2/p0-first-intervals

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - name: Run first V2-P0 deterministic intervals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          import time
          from pathlib import Path

          from lemmamind.change_intelligence import DeterministicChangeService
          from lemmamind.contracts import SourceRole
          from lemmamind.extraction import DeterministicExtractionService
          from lemmamind.github import GitHubCaptureService, GitHubRESTReader
          from lemmamind.objects import ContentAddressedFileStore
          from lemmamind.profiling import ArchitectureProfilingService, DeterministicTriageService
          from lemmamind.storage import SQLiteContractStore
          from lemmamind.tracking import RepositoryTrackingService
          from lemmamind.tracking_contracts import TrackingLevel
          from lemmamind.typescript_ast import typescript_aware_extractors

          class CountingGitHubRESTReader(GitHubRESTReader):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.api_requests = 0

              def _get_json(self, path, query=None):
                  self.api_requests += 1
                  return super()._get_json(path, query)

          intervals = [
              {
                  "repository": "CopilotKit/OpenBot",
                  "relationship": "READ_ONLY",
                  "baseline": "43ea5c11210c485551c25b41a4270c56a58591f1",
                  "current": "e8aa34451f73ef2719c22cc557be369d9ea70afb",
                  "paths": ["README.md", "server/src/tenant-package.ts"],
              },
              {
                  "repository": "openclaw/openclaw",
                  "relationship": "READ_ONLY",
                  "baseline": "20eef858aafbf6a3c45b0f20366a08192996f91b",
                  "current": "aec260b7002cf56232add300f3dd3454c81a10cf",
                  "paths": ["README.md", "docs/gateway/sandboxing.md"],
              },
              {
                  "repository": "NousResearch/hermes-agent",
                  "relationship": "READ_ONLY",
                  "baseline": "b2bd1ac63ff137a6287ce989d65dccee6b9155e2",
                  "current": "a6d6060d6128260d8536d0b92ae0324fff028ffd",
                  "paths": ["tools/environments/local.py", "tests/tools/test_local_setsid_descendant_sweep.py"],
              },
          ]

          reports = []
          for spec in intervals:
              started = time.perf_counter()
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  store = SQLiteContractStore(root / "lemmamind.db")
                  objects = ContentAddressedFileStore(root / "objects")
                  reader = CountingGitHubRESTReader(token=os.environ.get("GITHUB_TOKEN"))
                  capture = GitHubCaptureService(reader, store, objects)

                  previous = capture.capture_repository(
                      spec["repository"],
                      spec["paths"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["baseline"],
                  )
                  current = capture.capture_repository(
                      spec["repository"],
                      spec["paths"],
                      source_role=SourceRole.IMPLEMENTATION,
                      ref=spec["current"],
                  )
                  assert previous.revision.commit_sha == spec["baseline"]
                  assert current.revision.commit_sha == spec["current"]

                  extraction = DeterministicExtractionService(
                      store,
                      objects,
                      artifact_extractors=typescript_aware_extractors(),
                  )
                  previous_extract = extraction.extract_capture(previous.manifest.capture_id)
                  current_extract = extraction.extract_capture(current.manifest.capture_id)

                  change = DeterministicChangeService(store, objects).compare_captures(
                      previous.manifest.capture_id,
                      current.manifest.capture_id,
                      previous_extraction_run_id=previous_extract.run.run_id,
                      current_extraction_run_id=current_extract.run.run_id,
                      artifact_extractors=extraction.artifact_extractors,
                  )

                  profile = ArchitectureProfilingService(store).build_profile(
                      current.revision.source_revision_id,
                      evidence_run_ids=(current_extract.run.run_id,),
                  ).profile

                  tracking = RepositoryTrackingService(store)
                  assignment = tracking.assign_level(
                      current.source.source_id,
                      TrackingLevel.DEEP,
                      assigned_by="v2-p0-first-interval-probe",
                      reason="ephemeral local-only V2-P0 evaluation assignment",
                  )
                  triage = DeterministicTriageService(store, tracking).assess(
                      profile.architecture_profile_id,
                      domain_match=True,
                      sensitivity_flags=(),
                      structural_delta_ids=tuple(
                          item.structural_delta_id for item in change.structural_deltas
                      ),
                  ).assessment
                  assert triage.tracking_assignment_id == assignment.tracking_assignment_id

                  unique_hashes = {
                      artifact.content_hash
                      for artifact in (*previous.artifacts, *current.artifacts)
                  }
                  retained_bytes = sum(len(objects.get(content_hash)) for content_hash in unique_hashes)

                  reports.append({
                      "repository": spec["repository"],
                      "relationship": spec["relationship"],
                      "previous_commit": previous.revision.commit_sha,
                      "current_commit": current.revision.commit_sha,
                      "previous_tree": previous.revision.tree_sha,
                      "current_tree": current.revision.tree_sha,
                      "tree_changed": previous.revision.tree_sha != current.revision.tree_sha,
                      "requested_paths": list(spec["paths"]),
                      "previous_status": {
                          item.source_locator: item.retrieval_status.value
                          for item in previous.manifest.artifacts
                      },
                      "current_status": {
                          item.source_locator: item.retrieval_status.value
                          for item in current.manifest.artifacts
                      },
                      "artifact_deltas": [
                          {
                              "source_locator": item.source_locator,
                              "change_type": item.change_type.value,
                          }
                          for item in change.artifact_deltas
                      ],
                      "structural_delta_count": len(change.structural_deltas),
                      "structural_delta_types": sorted({
                          item.change_type.value for item in change.structural_deltas
                      }),
                      "structural_delta_locators": sorted({
                          item.source_locator for item in change.structural_deltas
                      }),
                      "previous_fact_count": len(previous_extract.facts),
                      "current_fact_count": len(current_extract.facts),
                      "previous_assertion_count": len(previous_extract.assertions),
                      "current_assertion_count": len(current_extract.assertions),
                      "profile_artifact_count": profile.artifact_count,
                      "profile_evidence_fact_count": profile.evidence_fact_count,
                      "profile_source_assertion_count": profile.source_assertion_count,
                      "extractor_profiles": list(profile.extractor_profiles),
                      "feature_keys": list(profile.feature_keys),
                      "triage_band": triage.band.value,
                      "triage_reasons": [item.value for item in triage.reasons],
                      "tracking_level": triage.tracking_level.value,
                      "api_requests": reader.api_requests,
                      "retained_unique_bytes": retained_bytes,
                      "pipeline_seconds": round(time.perf_counter() - started, 3),
                      "llm_tokens": 0,
                      "embedding_operations": 0,
                  })

          payload = {
              "probe": "V2-P0 first prospective deterministic intervals",
              "interval_count": len(reports),
              "reports": reports,
          }
          print("V2_P0_RESULT=" + json.dumps(payload, sort_keys=True))
          print(json.dumps(payload, sort_keys=True, indent=2))
          PY
