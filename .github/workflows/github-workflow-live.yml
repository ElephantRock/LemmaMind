name: github-workflow-live

on:
  push:
    branches:
      - m0/github-workflow-evidence

permissions:
  contents: read
  actions: read

jobs:
  workflow-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Offline regression suite
        run: pytest
      - name: Live Resonance-World workflow capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/run_github_workflow_probe.py --json /tmp/github-workflow.json
          echo '=== LEMMAMIND GITHUB WORKFLOW PROBE BEGIN ==='
          cat /tmp/github-workflow.json
          echo '=== LEMMAMIND GITHUB WORKFLOW PROBE END ==='
