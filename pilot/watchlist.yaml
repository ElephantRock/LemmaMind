version: 3
pilot_id: m-1-technical-intelligence
status: passed

research_question: >-
  Can disciplined evidence-grounded analysis across heterogeneous technical
  sources surface decision-relevant findings while preserving provenance,
  epistemic status, governance boundaries, belief revision, source role, and
  the separation between intelligence and optional action?

corpus_scope:
  controlled_organization: ElephantRock
  internal_repository_count: 9
  external_repository_count: 4
  total_repository_count: 13
  rationale: >-
    Start with a controlled heterogeneous portfolio, then test the same
    intelligence method against real external read-only sources. The external
    set includes a curated research index and three executable agent/runtime
    projects so source-role classification and no-write action boundaries are
    exercised before M0 implementation.

selection_rules:
  - Pin every case to exact source revisions or explicit issue/PR/workflow identities.
  - Prefer evidence-rich situations where a naive repository summary would be misleading.
  - Preserve negative, failed, cancelled, repaired, superseded, and no-action outcomes.
  - Do not require a repository repair for a case to count as useful intelligence.
  - Do not infer epistemic authority from repository write permission.
  - Distinguish curated/discovery sources from primary implementation evidence.

