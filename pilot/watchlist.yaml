known_limitations:
  - >-
    The corpus is purposefully selected for reasoning diversity and is not a
    statistically representative sample of GitHub or of agent runtimes.
  - >-
    External evidence is static/repository-based; M−1 does not validate broad
    web research, paper ingestion, or autonomous external execution.
  - >-
    The external cases validate read-only intelligence and action separation,
    not the mechanics or social policy of submitting upstream contributions.
