schema_version: lemmamind.pilot-coverage.v1
coverage_id: external-golden-evidence-v1
description: >-
  Deterministic evidence-recovery checks for the four external M-1 cases.
  Recovery means the current capture/extraction spine emitted source-addressed
  material sufficient to satisfy the explicit check below. It does not mean an
  expected Observation can be generated without review or reasoning.

cases:
  - case_id: external-openbot-capability-authority
    repository: CopilotKit/OpenBot
    revision: d293f2331bd5ff9ba4ad17af6ac94570a157d26d
    source_role: implementation
    paths:
      - README.md
      - server/src/tenant-package.ts
    requirements:
      - evidence_id: openbot-authority-1
        evidence_type: SourceAssertion
        check:
          kind: source_assertion_contains
          artifact: README.md
          fragments:
            - Skills are instructions, not capabilities
        needed_capability_if_missing: markdown-list-source-assertions
      - evidence_id: openbot-authority-2
        evidence_type: ObservedFact
        check:
          kind: unsupported
        needed_capability_if_missing: source-code-semantic-facts
      - evidence_id: openbot-authority-3
        evidence_type: ObservedFact
        check:
          kind: unsupported
        needed_capability_if_missing: source-code-semantic-facts

  - case_id: external-openclaw-sandbox-posture
    repository: openclaw/openclaw
    revision: c50f90251ebf1c420b8b8fbbff65fb39f77558f0
    source_role: implementation
    paths:
      - README.md
      - docs/gateway/sandboxing.md
    requirements:
      - evidence_id: openclaw-sandbox-1
        evidence_type: SourceAssertion
        check:
          kind: source_assertion_contains
          artifact: docs/gateway/sandboxing.md
          fragments:
            - Sandboxing is off by default
            - controlled by
      - evidence_id: openclaw-sandbox-2
        evidence_type: SourceAssertion
        check:
          kind: source_assertion_contains
          artifact: docs/gateway/sandboxing.md
          fragments:
            - The Gateway process always stays on the host
            - only tool execution moves into the sandbox
      - evidence_id: openclaw-sandbox-3
        evidence_type: SourceAssertion
        check:
          kind: source_assertion_contains
          artifact: docs/gateway/sandboxing.md
          fragments:
            - Elevated exec bypasses sandboxing
        needed_capability_if_missing: markdown-list-source-assertions

  - case_id: external-hermes-process-containment
    repository: NousResearch/hermes-agent
    revision: 41447a6d7063b2772b0c2f26a5b22d9bd444fb43
    source_role: implementation
    paths:
      - tools/environments/local.py
      - tests/tools/test_local_setsid_descendant_sweep.py
    requirements:
      - evidence_id: hermes-containment-1
        evidence_type: SourceAssertion
        check:
          kind: commit_message_contains
          fragments:
            - sweep setsid descendants
            - local timeout group-kill
        needed_capability_if_missing: commit-metadata-and-change-facts
      - evidence_id: hermes-containment-2
        evidence_type: EvidenceFact
        check:
          kind: python_ast_contains
          artifact: tools/environments/local.py
          functions:
            - LocalEnvironment._kill_process
            - LocalEnvironment._kill_process._sweep_escaped_descendants
          assignments:
            - scope: LocalEnvironment._kill_process
              target: descendants
              value_call: psutil.Process().children
              keywords:
                recursive: "True"
          calls:
            - scope: LocalEnvironment._kill_process._sweep_escaped_descendants
              callee: child.kill
            - scope: LocalEnvironment._kill_process
              callee: os.killpg
              args_contains:
                - signal.SIGTERM
            - scope: LocalEnvironment._kill_process
              callee: os.killpg
              args_contains:
                - signal.SIGKILL
        needed_capability_if_missing: python-ast-structural-facts
      - evidence_id: hermes-containment-3
        evidence_type: EvidenceFact
        check:
          kind: python_ast_contains
          artifact: tests/tools/test_local_setsid_descendant_sweep.py
          functions:
            - test_timeout_kill_reaps_setsid_grandchild
            - test_kill_process_survives_psutil_snapshot_failure
          calls:
            - scope: test_timeout_kill_reaps_setsid_grandchild
              callee: env.execute
            - scope: test_timeout_kill_reaps_setsid_grandchild
              callee: _wait_for_pid_exit
            - scope: test_kill_process_survives_psutil_snapshot_failure
              callee: env._kill_process
            - scope: test_kill_process_survives_psutil_snapshot_failure
              callee: monkeypatch.setattr
          assertions:
            - scope: test_timeout_kill_reaps_setsid_grandchild
              expression_contains: _wait_for_pid_exit
            - scope: test_kill_process_survives_psutil_snapshot_failure
              expression_contains: signal.SIGTERM
            - scope: test_kill_process_survives_psutil_snapshot_failure
              expression_contains: killpg_calls
        needed_capability_if_missing: python-ast-structural-facts

  - case_id: external-opd-source-type
    repository: chrisliu298/awesome-on-policy-distillation
    revision: e4b5e7334ccd3437ccab8d4eef770ed02c4f9934
    source_role: research_index
    paths:
      - README.md
      - CONTRIBUTING.md
      - CITATION.cff
      - LICENSE
    requirements:
      - evidence_id: opd-source-1
        evidence_type: SourceAssertion
        check:
          kind: source_assertion_contains
          artifact: README.md
          fragments:
            - A curated collection of papers, technical reports, frameworks, and tools
      - evidence_id: opd-source-2
        evidence_type: SourceAssertion
        check:
          kind: source_assertions_cover
          artifact: README.md
          fragments:
            - As of 2026, OPD is a standard post-training primitive
            - Frameworks and Implementations
      - evidence_id: opd-source-3
        evidence_type: ObservedFact
        check:
          kind: git_root_tree_contains
          require_complete: true
          exact_entries: true
          entries:
            - .claude
            - CITATION.cff
            - CONTRIBUTING.md
            - LICENSE
            - README.md
        needed_capability_if_missing: complete-repository-tree-facts
