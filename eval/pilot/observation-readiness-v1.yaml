schema_version: lemmamind.observation-readiness.v1
readiness_id: hard-golden-observation-v1
description: >-
  Measured readiness of the current M0/V1 epistemic spine against hard frozen
  golden cases. Ready means the case can be represented without weakening the
  current evidence/Observation boundary. Blocked means a concrete earlier-layer
  capability is missing. Deferred means the case belongs to a later semantic
  object rather than source-level Observation.

capabilities:
  supported_observation_v2:
    state: implemented
    reason: One Observation remains revision-bound; supersession may cross revisions of the same Source.
  deterministic_external_repository_evidence:
    state: implemented
    reason: The frozen external repository corpus is at 12/12 deterministic evidence recovery.
  source_role_contract:
    state: implemented
    reason: Source.source_role distinguishes implementation, research_index, research_program, mixed, and unknown.
  git_root_tree_evidence:
    state: implemented
    reason: Exact pinned Git root-tree capture and facts are available.
  github_issue_pr_evidence:
    state: implemented
    reason: Durable content-addressed current issue and pull-request snapshots emit deterministic metadata facts and authored title/body assertions while keeping process timestamps and PR SHAs distinct from the repository analysis anchor.
  github_process_event_history:
    state: implemented
    reason: Durable paginated issue-event history preserves provider event IDs, event kinds, actors, timestamps, and optional commit links; CSD issue #37 live validation directly recovered its close followed by reopen transition.
  github_workflow_run_evidence:
    state: implemented
    reason: Durable content-addressed workflow-run snapshots preserve run/job/step outcomes, timestamps, artifact metadata, and safe job-log availability without retaining log contents or inferring causes.
  temporal_change_reconciliation:
    state: implemented
    reason: Evidence-bound temporal reconciliation now validates explicit current process facts, exact PR base/head revision relationships, and ordered provider event transitions before constructing immutable superseding candidate Observations while preserving prior history.
  action_policy_validation:
    state: implemented
    reason: Evidence-bound policy evaluation separates repository capability from governance, blocks explicit prohibitions, enforces actor-role separation, and leaves independent authorization outside the evaluator.
  cross_repository_pattern_layer:
    state: deferred
    reason: Cross-repository synthesis belongs to Pattern/Insight semantics rather than source-level Observation.

cases:
  - case_id: external-opd-source-type
    golden_case: eval/pilot/cases/external-opd-source-type.yaml
    expected_case_type: source_type_boundary
    requires:
      - supported_observation_v2
      - deterministic_external_repository_evidence
      - source_role_contract
      - git_root_tree_evidence
    expected_outcome: ready
    boundary: >-
      The two golden observations are single-source/single-revision and can retain
      curated field claims as SourceAssertion while using root-tree facts and the
      research_index source role.

  - case_id: csd-foundry-frontier
    golden_case: eval/pilot/cases/csd-foundry-frontier.yaml
    expected_case_type: frontier_reconciliation
    requires:
      - supported_observation_v2
      - github_issue_pr_evidence
      - github_process_event_history
      - temporal_change_reconciliation
    expected_outcome: ready
    boundary: >-
      Current issue/PR snapshots recover the open umbrella, merged D5 PR, and
      still-open qualification PR; provider event history proves close followed by
      reopen; temporal reconciliation verifies PR #117 is based on the D5 merge
      revision and constructs a narrower superseding candidate without mutating
      the prior closure conclusion or auto-promoting review state.

  - case_id: resonance-world-confirmatory
    golden_case: eval/pilot/cases/resonance-world-confirmatory.yaml
    expected_case_type: scientific_integrity
    requires:
      - supported_observation_v2
      - github_issue_pr_evidence
      - github_workflow_run_evidence
      - action_policy_validation
    expected_outcome: ready
    boundary: >-
      Source-local issue/PR and workflow evidence reconstruct the frozen execution
      context, while action-policy validation separately enforces the explicit
      no-rerun rule, classifier-role separation, and independent promotion authority.
      The evaluator can recommend or reject but never grants authorization.

  - case_id: private-actions-pattern
    golden_case: eval/pilot/cases/private-actions-pattern.yaml
    expected_case_type: cross_repository_pattern
    requires:
      - github_workflow_run_evidence
      - cross_repository_pattern_layer
    expected_outcome: deferred
    boundary: >-
      Workflow evidence can represent zero-step/missing-log signatures, but
      the useful conclusion depends on comparison and negative controls across
      several repositories. Source-level Observation must reject this rather than
      weakening its one-revision invariant.
