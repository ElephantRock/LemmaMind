      Exact root-tree evidence changed across twelve top-level entries,
      including Dockerfile, agent, apps, gateway, hermes_cli, plugins, tests,
      tools, tui_gateway, and website. The prospectively selected local-process
      files were unchanged and emitted zero StructuralDelta records.
