    notes: >-
      The evidence correctly proved and broadly localized repository movement,
      but it did not identify the mechanism-level changes worth review.

important_misses:
  - summary: >-
      Image/package-managed installations were routed through one shared update
      admission gate that refuses in-place mutation, honors an authoritative
      image-provenance marker, fails closed on a corrupted marker, and records a
      refusal distinct from execution errors.
    source_locator: git:commit:4860978115a018913fe51efd61b2319e9273d0a4
    desired_priority: high
    notes: >-
      This is directly relevant to LemmaMind's capability-versus-authority and
      evidence-bound action-policy boundaries.
  - summary: >-
      Agent-as-provider completed tool work was projected back into the durable
      turn transcript without returning already completed calls as pending tool
      calls, preserving tool activity while avoiding duplicate execution.
    source_locator: git:commit:07200e9cd67f777de79497cc807a644861b2c87b
    desired_priority: high
    notes: >-
      This is relevant to tool provenance, durable reasoning state, and the
      distinction between completed provider work and pending actions.
  - summary: >-
      Headless onboarding was changed to fail closed when a model guard requires
      confirmation rather than hanging on an interactive confirmation surface
      that no user can answer.
    source_locator: git:commit:19f9d1badbb5748611807e84538527b8826567da
    desired_priority: high
    notes: >-
      This is a strong fail-closed governance/UX pattern that the V1 change
      surface did not identify.

